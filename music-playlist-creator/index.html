<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1>Music Playlist Explorer</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">All Playlists</a>
                <a href="featured.html" class="nav-link">Featured</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span class="theme-icon sun">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </span>
                    <span class="theme-icon moon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </span>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <div class="controls-container">
            <div class="search-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Search playlists, songs, or artists..."
                    autocomplete="off"
                >
                <button class="search-clear" id="searchClear" aria-label="Clear search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="sort-wrapper">
                <label for="sortSelect" class="sort-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18M7 12h10M11 18h6"/>
                    </svg>
                    Sort by
                </label>
                <select id="sortSelect" class="sort-select">
                    <option value="likes">Most Liked</option>
                    <option value="name">Name (A-Z)</option>
                    <option value="recent">Recently Added</option>
                </select>
            </div>
        </div>

        <div class="playlist-cards">
            <!-- Playlist cards will be dynamically generated here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Music Playlist Explorer</p>
    </footer>

    <!-- Floating Add Button -->
    <button class="fab" id="addPlaylistFab" aria-label="Add new playlist">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
    </button>

    <!-- Confirmation Modal -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-dialog">
            <h3 class="confirm-title" id="confirmTitle">Delete Playlist?</h3>
            <p class="confirm-message" id="confirmMessage"></p>
            <div class="confirm-actions">
                <button class="confirm-btn cancel-btn" id="confirmCancel">Cancel</button>
                <button class="confirm-btn delete-btn" id="confirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <!-- Playlist Modal structure -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header">
                <img src="" alt="Playlist cover" class="modal-cover" id="modalCover">
                <div class="modal-info">
                    <h2 class="modal-playlist-name" id="modalPlaylistName"></h2>
                    <p class="modal-playlist-author" id="modalPlaylistAuthor"></p>
                    <div class="modal-actions">
                        <button class="shuffle-btn" id="shuffleBtn">Shuffle</button>
                        <button class="description-btn" id="descriptionBtn">Get Description</button>
                    </div>
                    <div class="modal-description" id="modalDescription">
                        <!-- AI-generated description will appear here -->
                    </div>
                </div>
            </div>
            <div class="modal-songs" id="modalSongs">
                <!-- Songs will be populated here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Playlist Form Modal -->
    <div class="form-overlay" id="formOverlay">
        <div class="form-modal">
            <button class="modal-close" id="formClose">&times;</button>
            <h2 class="form-title" id="formTitle">Add New Playlist</h2>

            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step active" data-step="1">
                    <span class="step-number">1</span>
                    <span class="step-label">Details</span>
                </div>
                <div class="step" data-step="2">
                    <span class="step-number">2</span>
                    <span class="step-label">Songs</span>
                </div>
                <div class="step" data-step="3">
                    <span class="step-number">3</span>
                    <span class="step-label">Preview</span>
                </div>
            </div>

            <!-- Step 1: Playlist Details -->
            <div class="form-step active" id="step1">
                <div class="form-group">
                    <label for="playlistName">Playlist Name *</label>
                    <input type="text" id="playlistName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="playlistCreator">Creator Name *</label>
                    <input type="text" id="playlistCreator" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="playlistCover">Cover Image URL *</label>
                    <input type="url" id="playlistCover" class="form-input" placeholder="https://..." required>
                </div>
            </div>

            <!-- Step 2: Add Songs -->
            <div class="form-step" id="step2">
                <div id="songsContainer"></div>
                <button type="button" class="add-song-btn" id="addSongBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add Song
                </button>
            </div>

            <!-- Step 3: Preview -->
            <div class="form-step" id="step3">
                <div class="preview-content" id="previewContent"></div>
            </div>

            <!-- Form Navigation -->
            <div class="form-nav">
                <button type="button" class="form-nav-btn secondary" id="prevBtn" style="display: none;">Previous</button>
                <button type="button" class="form-nav-btn primary" id="nextBtn">Next</button>
                <button type="button" class="form-nav-btn primary" id="submitBtn" style="display: none;">Save Playlist</button>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="secrets.js"></script>
    <script src="shared.js"></script>
    <script src="script.js"></script>
    <script src="playlist-manager.js"></script>
</body>
</html>
