<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1>Music Playlist Explorer</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">All Playlists</a>
                <a href="featured.html" class="nav-link">Featured</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span class="theme-icon sun">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </span>
                    <span class="theme-icon moon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </span>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <div class="search-container">
            <div class="search-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Search playlists, songs, or artists..."
                    autocomplete="off"
                >
                <button class="search-clear" id="searchClear" aria-label="Clear search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="playlist-cards">
            <!-- Playlist cards will be dynamically generated here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Music Playlist Explorer</p>
    </footer>

    <!-- Modal structure -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header">
                <img src="" alt="Playlist cover" class="modal-cover" id="modalCover">
                <div class="modal-info">
                    <h2 class="modal-playlist-name" id="modalPlaylistName"></h2>
                    <p class="modal-playlist-author" id="modalPlaylistAuthor"></p>
                    <div class="modal-actions">
                        <button class="shuffle-btn" id="shuffleBtn">Shuffle</button>
                        <button class="description-btn" id="descriptionBtn">Get Description</button>
                    </div>
                    <div class="modal-description" id="modalDescription">
                        <!-- AI-generated description will appear here -->
                    </div>
                </div>
            </div>
            <div class="modal-songs" id="modalSongs">
                <!-- Songs will be populated here -->
            </div>
        </div>
    </div>
    <script src="theme.js"></script>
    <script src="secrets.js"></script>
    <script src="shared.js"></script>
    <script src="script.js"></script>
</body>
</html>
