<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Featured Playlist - Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1>Music Playlist Explorer</h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link">All Playlists</a>
                <a href="featured.html" class="nav-link active">Featured</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span class="theme-icon sun">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </span>
                    <span class="theme-icon moon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </span>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <div class="featured-container">
            <div class="featured-left">
                <img src="" alt="Featured playlist cover" id="featuredCover" class="featured-cover">
                <h2 id="featuredPlaylistName" class="featured-playlist-name"></h2>
                <p id="featuredCreator" class="featured-creator"></p>
                <div class="featured-footer">
                    <span id="featuredSongCount" class="footer-stat">0 songs</span>
                    <span class="footer-divider">•</span>
                    <span id="featuredTotalTime" class="footer-stat">0:00</span>
                </div>
                <div class="featured-actions">
                    <button class="action-btn play-all-btn featured-play-btn" id="featuredPlayAllBtn" title="Play all songs">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
                    <button class="action-btn shuffle-btn" id="featuredShuffleBtn" title="Shuffle songs">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8"/>
                            <line x1="4" y1="20" x2="21" y2="3"/>
                            <polyline points="21 16 21 21 16 21"/>
                            <line x1="15" y1="15" x2="21" y2="21"/>
                            <line x1="4" y1="4" x2="9" y2="9"/>
                        </svg>
                    </button>
                    <button class="action-btn description-btn" id="featuredDescriptionBtn" title="Generate AI description">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="featured-right">
                <div class="featured-header">
                    <h3 class="featured-songs-title">Songs</h3>
                </div>
                <div class="modal-description" id="featuredDescription">
                    <!-- AI-generated description will appear here -->
                </div>
                <div id="featuredSongs" class="featured-songs">
                    <!-- Songs will be populated here -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Music Playlist Explorer</p>
    </footer>

    <!-- Now Playing Bar -->
    <div id="nowPlayingBar" class="now-playing-bar">
        <div class="now-playing-content">
            <img id="nowPlayingCover" class="now-playing-cover" src="" alt="Album art">
            <div class="now-playing-info">
                <div id="nowPlayingSong" class="now-playing-song">Song Title</div>
                <div id="nowPlayingMeta" class="now-playing-meta">Artist • Playlist</div>
            </div>
        </div>
        <div class="now-playing-controls">
            <button id="nowPlayingToggle" class="now-playing-btn" aria-label="Play/Pause">⏸</button>
            <button id="nowPlayingClose" class="now-playing-btn" aria-label="Close">✕</button>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="secrets.js"></script>
    <script src="shared.js"></script>
    <script src="featured.js"></script>
</body>
</html>
